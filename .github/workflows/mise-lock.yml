# Regenerates home/dot_config/mise/mise.lock on a branch and commits it there
# (docs/adr/0023-applications-from-one-data-file.md). Run it from the Actions
# tab on the branch that changed applications.toml, when the `mise-lock`
# check in ci.yml fails. Versions already locked are kept; raising them is
# the scheduled bump PR's job.
#
# Locks on Linux on purpose: mise on NixOS defaults to compiling python and
# would write a NixOS-only python entry.
#
# A commit pushed with GITHUB_TOKEN starts no other workflow, so re-run the
# PR's checks (or push again) afterwards.
name: mise lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    env:
      # mise resolves releases through the GitHub API; the token lifts the
      # anonymous rate limit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install chezmoi and mise
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          curl -fsSL https://mise.run | MISE_INSTALL_PATH="$HOME/.local/bin/mise" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Regenerate mise.lock
        run: .github/scripts/mise-lock.sh

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- home/dot_config/mise/mise.lock)" ]; then
            echo "mise.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home/dot_config/mise/mise.lock
          git commit -m "dotfiles: regenerate mise.lock" -m "Generated by the mise lock workflow from applications.toml."
          git push
