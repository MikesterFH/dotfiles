# See personal.toml in this directory for the seeding mechanism explanation.
#
# Same as personal.toml, except vscodeConfig=false — the one CI case that
# exercises a GUI-app opt-out prompt rather than just its true default.
# Linux-only in ci.yml; the opt-out mechanism itself isn't OS-specific.
[data]
    profile = "personal"
    devpod = false
    weztermConfig = true
    vscodeConfig = false
    zedConfig = true
    windowsTerminalConfig = true
    iterm2Config = true

[data.git.personal]
    name = "CI Runner"
    email = "ci-personal@example.invalid"

[data.git.work]
    name = "CI Runner"
    email = "ci-work@example.invalid"
