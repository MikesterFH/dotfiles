# See personal.toml in this directory for the seeding mechanism explanation.
#
# dev-server profile: personal+work git identities. No Application list
# seeded here — it's derived from `profile` inside .chezmoi.toml.tmpl, not
# prompted for; dev-server resolves to CLI tools only, so no GUI configs.
[data]
    profile = "dev-server"
    devpod = false

[data.git.personal]
    name = "CI Runner"
    email = "ci-personal@example.invalid"

[data.git.work]
    name = "CI Runner"
    email = "ci-work@example.invalid"
