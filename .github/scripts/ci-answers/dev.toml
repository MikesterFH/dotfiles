# See personal.toml in this directory for the seeding mechanism explanation.
#
# dev profile: work+client git identities only (no personal). The
# Application list is derived from `profile` inside .chezmoi.toml.tmpl, not
# prompted for, so nothing to seed here for it.
[data]
    profile = "dev"
    devpod = false

[data.git.work]
    name = "CI Runner"
    email = "ci-work@example.invalid"

[data.git.client]
    name = "CI Runner"
    email = "ci-client@example.invalid"
