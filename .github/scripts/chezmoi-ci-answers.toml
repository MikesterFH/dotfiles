# Pre-seeds chezmoi's own config file (normally $HOME/.config/chezmoi/chezmoi.toml)
# before `chezmoi init` runs, so promptStringOnce/promptBoolOnce/promptChoiceOnce
# in .chezmoi.toml.tmpl find these values already present and never prompt.
#
# `--promptString`/`--promptBool` on `chezmoi init` do NOT reliably satisfy the
# *Once variants (https://github.com/twpayne/chezmoi/issues/3345) — pre-seeding
# the config file's [data] table is the documented mechanism those functions
# actually check, so it's what CI relies on here.
#
# profile is fixed at "personal" here — this job only verifies a single
# representative render, at the true default for all five GUI-app bools.
# Verifying all three profile values (personal/dev/dev-server) plus GUI
# opt-out combinations across the OS matrix is out of scope for this seed
# file; see https://github.com/MikesterFH/dotfiles/issues/15. All five bools
# are seeded regardless of runner OS since this one file is shared across
# the whole matrix — promptBoolOnce just never fires for the two that don't
# apply to a given OS (windowsTerminalConfig, iterm2Config).
[data]
    profile = "personal"
    devpod = false
    weztermConfig = true
    vscodeConfig = true
    zedConfig = true
    windowsTerminalConfig = true
    iterm2Config = true

[data.git.personal]
    name = "CI Runner"
    email = "ci-personal@example.invalid"

[data.git.work]
    name = "CI Runner"
    email = "ci-work@example.invalid"

[data.git.client]
    name = "CI Runner"
    email = "ci-client@example.invalid"
