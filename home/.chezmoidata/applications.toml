# Every Application, declared once (docs/adr/0023-applications-from-one-data-file.md).
# Read by the manifest templates (Brewfile, apt, winget), the global mise
# config, .chezmoiignore, .chezmoiexternal, the install scripts, the CI
# asserts and the Nix module; each filters by Profile, OS and architecture itself. The chezmoi
# config template cannot read this file, so it holds no Application list.
#
# Order matters: manifests list their entries in this order.
#
# Fields
#   name       Application name, referenced by templates (`has "zen" $apps`)
#   kind       cli | gui | system | runtime (docs and asserts only)
#   profiles   Profiles that get it
#   mise       mise backend:name. Installed by mise on every OS unless
#              mise_os narrows it; elsewhere the native identifier applies.
#   mise_os    OSes (chezmoi .chezmoi.os) where mise installs it; absent = all
#   mise_arch  per OS, the architectures mise installs it on; absent = all
#   version    exact pin (or "lts" for node); absent = latest
#   brew       Homebrew formula, or "cask:<cask>" for a cask
#   brew_tap   third-party tap the cask comes from, trusted for that cask only
#              (docs/adr/0018-aerospace-and-trusted-taps.md)
#   apt        Debian/apt package
#   winget     winget package identifier
#   nix        for the home-manager module (nix/home-module.nix, ADR 0021): a
#              nixpkgs attribute path, a list of them, { flake = "<input>" }
#              for a flake input's default package, or { module = "<option>" }
#              when a module option installs it. Absent = not on Nix.
#
# A platform with neither a mise entry for it nor a native identifier simply
# does not get the Application there (e.g. iterm2 outside macOS).

# -- Runtimes for Neovim's Mason (docs/adr/0011-nvim-toolchain.md) ----------

[[application]]
name     = "node"
kind     = "runtime"
profiles = ["personal", "dev", "dev-server"]
mise     = "node"
version  = "lts"
nix      = { module = "dotfiles.nodejs" }

[[application]]
name     = "python"
kind     = "runtime"
profiles = ["personal", "dev", "dev-server"]
mise     = "python"
version  = "3.13"
nix      = "python313"

# -- CLI tools the configs rely on, every Profile (ADR 0008) -----------------

# No macos-x64 build: Intel Macs keep it on Homebrew.
[[application]]
name      = "delta"
kind      = "cli"
profiles  = ["personal", "dev", "dev-server"]
mise      = "aqua:dandavison/delta"
mise_arch = { darwin = ["arm64"] }
brew      = "git-delta"
winget    = "dandavison.delta"
nix       = "delta"

[[application]]
name     = "starship"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:starship/starship"
brew     = "starship"
winget   = "Starship.Starship"
nix      = "starship"

# Pinned on every OS: nvim/lazy-lock.json only fits one Neovim (ADR 0013).
[[application]]
name     = "neovim"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:neovim/neovim"
version  = "0.12.6"
nix      = { module = "programs.neovim" }

# No Windows build: psmux, a Bootstrap Package, stands in (ADR 0005).
# tmux-builds ships static binaries (tmux itself publishes source only).
[[application]]
name     = "tmux"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:tmux/tmux-builds"
mise_os  = ["linux", "darwin"]
brew     = "tmux"
apt      = "tmux"
nix      = "tmux"

[[application]]
name     = "fzf"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:junegunn/fzf"
brew     = "fzf"
winget   = "junegunn.fzf"
nix      = "fzf"

[[application]]
name     = "zoxide"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:ajeetdsouza/zoxide"
brew     = "zoxide"
winget   = "ajeetdsouza.zoxide"
nix      = "zoxide"

[[application]]
name     = "yazi"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:sxyazi/yazi"
brew     = "yazi"
winget   = "sxyazi.yazi"
nix      = "yazi"

[[application]]
name     = "glow"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:charmbracelet/glow"
brew     = "glow"
winget   = "charmbracelet.glow"
nix      = "glow"

[[application]]
name     = "bat"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:sharkdp/bat"
brew     = "bat"
winget   = "sharkdp.bat"
nix      = "bat"

[[application]]
name     = "lazygit"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:jesseduffield/lazygit"
brew     = "lazygit"
winget   = "JesseDuffield.lazygit"
nix      = "lazygit"

# Pinned with Neovim (ADR 0013): nvim-treesitter builds parsers with it.
[[application]]
name     = "tree-sitter-cli"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:tree-sitter/tree-sitter"
version  = "0.27.1"
nix      = "tree-sitter"

[[application]]
name     = "ripgrep"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:BurntSushi/ripgrep"
brew     = "ripgrep"
winget   = "BurntSushi.ripgrep.MSVC"
nix      = "ripgrep"

[[application]]
name     = "fd"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:sharkdp/fd"
brew     = "fd"
winget   = "sharkdp.fd"
nix      = "fd"

# macOS and Windows ship unzip/Expand-Archive.
[[application]]
name     = "unzip"
kind     = "system"
profiles = ["personal", "dev", "dev-server"]
apt      = "unzip"
nix      = "unzip"

[[application]]
name     = "cmake"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:Kitware/CMake"
brew     = "cmake"
apt      = "cmake"
winget   = "Kitware.CMake"
nix      = "cmake"

# cc/make: the Xcode Command Line Tools on macOS (Homebrew's own
# prerequisite); on Windows the VS Build Tools, which need a workload
# override `winget import` can't pass, so the Windows Application script
# installs them itself.
[[application]]
name     = "build-tools"
kind     = "system"
profiles = ["personal", "dev", "dev-server"]
apt      = "build-essential"
nix      = ["gnumake", "gcc"]

# No macOS builds upstream, none for windows-arm64: Macs keep it on Homebrew,
# Windows on ARM on winget.
[[application]]
name      = "eza"
kind      = "cli"
profiles  = ["personal", "dev", "dev-server"]
mise      = "aqua:eza-community/eza"
mise_os   = ["linux", "windows"]
mise_arch = { windows = ["amd64"] }
brew      = "eza"
winget    = "eza-community.eza"
nix       = "eza"

# macOS ships zsh; no zsh on the Windows Target.
[[application]]
name     = "zsh"
kind     = "system"
profiles = ["personal", "dev", "dev-server"]
apt      = "zsh"
nix      = "zsh"

# macOS ships file; on Windows yazi uses Git for Windows' file.exe.
[[application]]
name     = "file"
kind     = "system"
profiles = ["personal", "dev", "dev-server"]
apt      = "file"
nix      = "file"

# Windows keeps winget: the release has only the standalone 7za there,
# no 7z.exe for yazi (ADR 0014).
[[application]]
name     = "7zip"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:ip7z/7zip"
mise_os  = ["linux", "darwin"]
brew     = "sevenzip"
apt      = "7zip"
winget   = "7zip.7zip"
nix      = "p7zip"

# conda backend: apt only ships ImageMagick 6, yazi needs 7's `magick`
# (docs/adr/0014-yazi-previews-on-every-platform.md). Windows keeps winget:
# the conda build there is lockable but has never been run.
[[application]]
name     = "imagemagick"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "conda:imagemagick"
mise_os  = ["linux", "darwin"]
brew     = "imagemagick"
winget   = "ImageMagick.ImageMagick"
nix      = "imagemagick"

[[application]]
name     = "poppler"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
brew     = "poppler"
apt      = "poppler-utils"
winget   = "oschwartz10612.Poppler"
nix      = "poppler-utils"

# Linux binaries for amd64 only and none for Windows; one tool mise can't
# install fails the whole `mise install`, so those platforms use the native
# manager or go without.
[[application]]
name      = "resvg"
kind      = "cli"
profiles  = ["personal", "dev", "dev-server"]
mise      = "aqua:linebender/resvg"
mise_os   = ["linux", "darwin"]
mise_arch = { linux = ["amd64"] }
brew      = "resvg"
winget    = "linebender.resvg"
nix       = "resvg"

[[application]]
name     = "jq"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:jqlang/jq"
brew     = "jq"
apt      = "jq"
winget   = "jqlang.jq"
nix      = "jq"

[[application]]
name     = "ffmpeg"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
brew     = "ffmpeg"
apt      = "ffmpeg"
winget   = "Gyan.FFmpeg"
nix      = "ffmpeg"

[[application]]
name     = "uv"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:astral-sh/uv"
brew     = "uv"
winget   = "astral-sh.uv"
nix      = "uv"

[[application]]
name     = "helix"
kind     = "cli"
profiles = ["personal", "dev", "dev-server"]
mise     = "aqua:helix-editor/helix"
brew     = "helix"
winget   = "Helix.Helix"
nix      = "helix"

# No winget package, so Windows on ARM goes without it (ADR 0017).
[[application]]
name      = "hunk"
kind      = "cli"
profiles  = ["personal", "dev", "dev-server"]
mise      = "aqua:modem-dev/hunk"
mise_arch = { windows = ["amd64"] }
brew      = "hunk"
nix       = { flake = "hunk" }

