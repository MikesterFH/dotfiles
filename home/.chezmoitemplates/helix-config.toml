theme = "tokyonight"

[editor]
line-number = "relative"
rulers = [80]
popup-border = "all"
auto-pairs = false
bufferline = "multiple"
end-of-line-diagnostics = "hint"

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-encoding"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
character = "┆"

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-messages = true

[keys.insert]
j = { j = "normal_mode" }

[keys.normal]
# lazygit in tmux popup
C-g = ":sh tmux display-popup -E -w 90% -h 90% lazygit"
