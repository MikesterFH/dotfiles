### PSMUX CONFIGURATION (Windows, psmux 3.4+) ###

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

unbind C-b
set-option -g prefix C-f
set-option -g prefix2 None
bind-key C-f send-prefix

unbind '"'
bind - split-window -v -c "#{pane_current_path}"
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind v
bind v copy-mode

unbind r
bind r source-file ~/.psmux.conf \; display-message "~/.psmux.conf reloaded"

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

bind -n C-d previous-window
bind -n C-u next-window
set -g mouse on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key n command-prompt "new-session -s '%%'"

set -s escape-time 0
set -g focus-events on

set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'

set -g @tokyonight-style 'night'
set -g @tokyonight-show-powerline 'on'
set -g @plugin 'psmux-plugins/psmux-theme-tokyonight'

# Evaluate per keypress; no pwsh-based vim-navigator poller needed.
# Neovim handles its splits first and selects a psmux pane at the edge.
bind-key -n C-h if-shell -F '#{m/r:(^|/)g?(view|l?n?vim?x?|fzf)(diff)?(\.exe)?$,#{pane_current_command}}' 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell -F '#{m/r:(^|/)g?(view|l?n?vim?x?|fzf)(diff)?(\.exe)?$,#{pane_current_command}}' 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell -F '#{m/r:(^|/)g?(view|l?n?vim?x?|fzf)(diff)?(\.exe)?$,#{pane_current_command}}' 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell -F '#{m/r:(^|/)g?(view|l?n?vim?x?|fzf)(diff)?(\.exe)?$,#{pane_current_command}}' 'send-keys C-l' 'select-pane -R'
bind-key -n C-\ if-shell -F '#{m/r:(^|/)g?(view|l?n?vim?x?|fzf)(diff)?(\.exe)?$,#{pane_current_command}}' 'send-keys C-\' 'select-pane -l'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\ select-pane -l
bind-key C-l send-keys C-l

set -g @plugin 'psmux-plugins/psmux-net-speed'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @plugin 'psmux-plugins/psmux-continuum'

set -g status-interval 1
set -g status-right '#{@net_speed_display} | %H:%M'
set -g @continuum-restore "on"

# Keep plugin initialization last.
run '~/.psmux/plugins/ppm/ppm.ps1'
