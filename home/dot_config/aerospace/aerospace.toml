# AeroSpace tiling window manager (macOS only), see
# docs/adr/0018-aerospace-and-trusted-taps.md and
# https://nikitabobko.github.io/AeroSpace/guide
#
# Modifier is ctrl-alt (⌃⌥), not AeroSpace's default alt:
# - on the Swiss German layout ⌥ types characters (⌥G = @, ⌥5/⌥6 = [ ],
#   ⌥7 = |, ⌥8/⌥9 = { }), which bare alt bindings would swallow
# - Neovim uses <M-h/j/k/l> to resize splits and tmux panes
# Left unbound for other apps: ⌃⌥Space opens Raycast, and Rectangle keeps
# ⌃⌥N / ⌃⌥B for its todo feature.
#
# Keys are named by their US-qwerty position (AeroSpace's key-mapping
# preset), so only letters, digits and tab are used: those sit in the same
# place on QWERTZ, apart from y/z, which aren't bound.

config-version = 2

start-at-login = true

after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# cmd-h (hide app) would leave holes AeroSpace can't tile; unhide instead
automatically-unhide-macos-hidden-apps = true

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 8
    inner.vertical =   8
    outer.left =       8
    outer.bottom =     8
    outer.top =        8
    outer.right =      8

[mode.main.binding]
    # Focus / move, vim directions
    ctrl-alt-h = 'focus left'
    ctrl-alt-j = 'focus down'
    ctrl-alt-k = 'focus up'
    ctrl-alt-l = 'focus right'

    ctrl-alt-shift-h = 'move left'
    ctrl-alt-shift-j = 'move down'
    ctrl-alt-shift-k = 'move up'
    ctrl-alt-shift-l = 'move right'

    # Layout: t = tiles, a = accordion (each toggles orientation when
    # pressed again), f = fullscreen, shift-f = float/tile the window
    ctrl-alt-t = 'layout tiles horizontal vertical'
    ctrl-alt-a = 'layout accordion horizontal vertical'
    ctrl-alt-f = 'fullscreen'
    ctrl-alt-shift-f = 'layout floating tiling'

    # Workspaces
    ctrl-alt-1 = 'workspace 1'
    ctrl-alt-2 = 'workspace 2'
    ctrl-alt-3 = 'workspace 3'
    ctrl-alt-4 = 'workspace 4'
    ctrl-alt-5 = 'workspace 5'
    ctrl-alt-6 = 'workspace 6'
    ctrl-alt-7 = 'workspace 7'
    ctrl-alt-8 = 'workspace 8'
    ctrl-alt-9 = 'workspace 9'

    ctrl-alt-shift-1 = 'move-node-to-workspace 1'
    ctrl-alt-shift-2 = 'move-node-to-workspace 2'
    ctrl-alt-shift-3 = 'move-node-to-workspace 3'
    ctrl-alt-shift-4 = 'move-node-to-workspace 4'
    ctrl-alt-shift-5 = 'move-node-to-workspace 5'
    ctrl-alt-shift-6 = 'move-node-to-workspace 6'
    ctrl-alt-shift-7 = 'move-node-to-workspace 7'
    ctrl-alt-shift-8 = 'move-node-to-workspace 8'
    ctrl-alt-shift-9 = 'move-node-to-workspace 9'

    ctrl-alt-tab = 'workspace-back-and-forth'
    ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Cheat sheet: every binding, read from the running config (keys.sh)
    ctrl-alt-c = 'exec-and-forget ~/.config/aerospace/keys.sh --show'

    # Modes: r = resize with h/j/k/l, s = service (reload, reset, join)
    ctrl-alt-r = 'mode resize'
    ctrl-alt-s = 'mode service'

[mode.resize.binding]
    h = 'resize width -50'
    l = 'resize width +50'
    j = 'resize height +50'
    k = 'resize height -50'
    b = 'balance-sizes'
    enter = 'mode main'
    esc = 'mode main'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    backspace = ['close-all-windows-but-current', 'mode main']

    shift-h = ['join-with left', 'mode main']
    shift-j = ['join-with down', 'mode main']
    shift-k = ['join-with up', 'mode main']
    shift-l = ['join-with right', 'mode main']

# Dialog-like apps float instead of being squeezed into a tile. Find an
# app's bundle id with `aerospace list-apps`.
[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.ActivityMonitor'
    run = 'layout floating'
